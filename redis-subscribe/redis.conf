# ============================================================================
# REDIS CONFIGURATION FOR 'TEMP LIST' (ACTIVE HOSPITAL VISITS)
# ============================================================================

# --- NETWORK ---
# Bind to all IPv4 interfaces so Docker containers can communicate with it
bind 0.0.0.0

# Disable protected mode because we are running inside an isolated Docker network.
# (In a strict production environment, you should enable requirepass below)
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# --- GENERAL ---
daemonize no
loglevel notice
# We only need 1 database for this microservice to keep things clean
databases 1 

# --- MEMORY MANAGEMENT ---
# 3,000 hashes per day is extremely small (likely less than 10MB).
# Setting a 256MB limit ensures Redis never consumes all host server memory if a bug occurs.
maxmemory 256mb

# Eviction Policy: 'volatile-ttl' 
# If memory ever hits 256MB, Redis will evict keys that have an expiration (TTL) set, 
# prioritizing the keys that are closest to expiring. 
maxmemory-policy volatile-ttl

# --- PERSISTENCE (CRITICAL FOR YOUR USE CASE) ---
# Even though this is a "temp" list, we must preserve state within the 18-hour window.
# If Redis restarts mid-day, AOF ensures we remember who already received an SMS today.
appendonly yes

# Fsync every second offers the best compromise between performance and data safety.
# In the worst-case crash, you only lose 1 second of state updates.
appendfsync everysec

# AOF Rewrite settings: 
# Since keys expire after 18 hours, the AOF file will grow. Redis will automatically 
# rewrite and shrink the AOF file when it grows by 100% and is at least 64mb.
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Disable RDB snapshots since AOF is sufficient and more accurate for this state tracking
save ""

# --- LAZY FREEING ---
# Deleting large keys asynchronously prevents blocking the main thread.
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes