# Automatically spawn a worker process for each CPU core
worker_processes auto;

events {
    worker_connections 1024;
    # multi_accept on; # Optional: allows a worker to accept all new connections at once
}

http {
    # --- Basic Optimization ---
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off; # Hide Nginx version

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Allow larger payloads (e.g., file uploads, large API requests). Adjust as needed.
    client_max_body_size 20M; 

    # --- Gzip Compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # --- Rate Limiting Zones ---
    # General rate limit (10 req/sec)
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    # Stricter rate limit for authentication (2 req/sec)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;

    # Docker internal DNS resolver (Forces Nginx to re-resolve if containers restart)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- HTTP Redirect ---
    server {
        listen 80;
        server_name tranghos.moph.go.th;
        location / {
            return 301 https://$host$request_uri;
        }
    }    

    # --- HTTPS Server ---
    server {
        listen 443 ssl;
        http2 on;
        server_name tranghos.moph.go.th;

        # SSL Certificate
        ssl_certificate /etc/nginx/ssl/proxy-server.crt;
        ssl_certificate_key /etc/nginx/ssl/proxy-server.key;             

        # SSL Optimization
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # SSL Protocols & Ciphers
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;

        # --- Security Headers ---
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        # Note: If your app requires external scripts/fonts, you will need to loosen this CSP.
        # add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; form-action 'self';" always;

        # --- Proxy Defaults ---
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Enable Keepalive to Upstream Node.js Apps and support WebSockets
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_ssl_verify off; # Internal self-signed certs

        # --- Locations ---

        # Public Welcome
        location / {
            limit_req zone=general burst=20 nodelay;
            set $upstream_public https://public:3006;
            proxy_pass $upstream_public;
        }

        # Login (Stricter Rate Limit)
        location ^~ /login/ {
            limit_req zone=auth burst=5 nodelay;
            
            # Using variables for dynamic Docker DNS resolution. 
            # Note: We rewrite the path to strip '/login/' exactly as your trailing slash did.
            set $upstream_login https://login:3006;
            rewrite ^/login/(.*) /$1 break;
            proxy_pass $upstream_login;
        }

        # Logout
        location ^~ /logout/ {
            set $upstream_logout https://logout:3006;
            rewrite ^/logout/(.*) /$1 break;
            proxy_pass $upstream_logout;
        }       

        # Food Dashboard
        location ^~ /food/ {
            set $upstream_nutrition https://nutrition:3006;
            rewrite ^/food/(.*) /$1 break;
            proxy_pass $upstream_nutrition;
        }  

        # --- LINE API Routing ---
        location ^~ /webhook/ {
            # Route to the new line-bot container
            set $upstream_line https://webhook:3006; 
            
            # Strip the prefix so it hits the '/' route in Express
            rewrite ^/webhook/(.*) /$1 break;
            proxy_pass $upstream_line;

            # CRITICAL: Pass the signature header required by LINE
            proxy_set_header X-Line-Signature $http_x_line_signature;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }               

        # --- Commented Out Services ---
        
        # location ^~ /refresh-token-renewer/ {
        #    set $upstream_renewer https://refresh-token-renewer:3006;
        #    rewrite ^/refresh-token-renewer/(.*) /$1 break;
        #    proxy_pass $upstream_renewer;
        # }

        # location ^~ /hosxp-api/ {
        #    set $upstream_hosxp https://hosxp-api:3006;
        #    rewrite ^/hosxp-api/(.*) /$1 break;
        #    proxy_pass $upstream_hosxp;
        # }  

        # location ^~ /authorized/ {
        #    set $upstream_auth https://authorized-server:3006;
        #    rewrite ^/authorized/(.*) /$1 break;
        #    proxy_pass $upstream_auth;
        # }               
    }
}