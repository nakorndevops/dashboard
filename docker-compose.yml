# Use Extension Fields (YAML Anchors) to keep the file DRY (Don't Repeat Yourself)
x-node-service: &node-service
  user: "node"
  restart: unless-stopped
  environment:
    - NODE_ENV=production
    - TZ=Asia/Bangkok
    - NODE_EXTRA_CA_CERTS=/usr/src/app/ssl/combine_ssl.pem
  networks:
    - app-network
  deploy:
    resources:
      limits:
        cpus: "0.50"
        memory: 512M
      reservations:
        memory: 128M

services:
  # Proxy Server - The ONLY service exposing ports
  proxy-server:
    image: nginx:alpine
    container_name: proxy-server
    ports:
      - "80:80"
      - "443:443"
    environment:
      - TZ=Asia/Bangkok
    volumes:
      - ./proxy-server/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl/tranghos-ssl/tranghos.moph.go.th.crt:/etc/nginx/ssl/proxy-server.crt:ro
      - ./ssl/tranghos-ssl/tranghos.moph.go.th.key:/etc/nginx/ssl/proxy-server.key:ro
    networks:
      - app-network
    restart: unless-stopped
    # The proxy should depend on the backends it routes to, not the other way around.
    depends_on:
      - public
      - login
      - nutrition
      - logout
      - refresh-token-renewer
      - hosxp-api
      - authorized-server
      - webhook

  # Public Route Service
  public:
    <<: *node-service
    build:
      context: ./public
      dockerfile: Dockerfile
    container_name: public
    volumes:
      - ./ssl/combine_ssl.pem:/usr/src/app/ssl/combine_ssl.pem:ro
      - ./ssl/public/public.crt:/usr/src/app/ssl/public.crt:ro
      - ./ssl/public/public.key:/usr/src/app/ssl/public.key:ro

  # Login Frontend
  login:
    <<: *node-service
    build:
      context: ./login
      dockerfile: Dockerfile
    container_name: login
    depends_on:
      redis-token:
        condition: service_healthy
    volumes:
      - ./ssl/combine_ssl.pem:/usr/src/app/ssl/combine_ssl.pem:ro
      - ./ssl/login/login.crt:/usr/src/app/ssl/login.crt:ro
      - ./ssl/login/login.key:/usr/src/app/ssl/login.key:ro
      - ./key/access-token/public.pem:/usr/src/app/access-token/public.pem:ro
      - ./jwt/login/client-secret.jwt:/usr/src/app/jwt/client-secret.jwt:ro
      - ./module/continueIfNotLogin.js:/usr/src/app/module/continueIfNotLogin.js

  # Food Frontend
  nutrition:
    <<: *node-service
    build:
      context: ./nutrition
      dockerfile: Dockerfile
    container_name: nutrition
    depends_on:
      redis-token:
        condition: service_healthy
    volumes:
      - ./ssl/combine_ssl.pem:/usr/src/app/ssl/combine_ssl.pem:ro
      - ./ssl/nutrition/nutrition.crt:/usr/src/app/ssl/nutrition.crt:ro
      - ./ssl/nutrition/nutrition.key:/usr/src/app/ssl/nutrition.key:ro
      - ./key/access-token/public.pem:/usr/src/app/access-token/public.pem:ro
      - ./jwt/nutrition/client-secret.jwt:/usr/src/app/jwt/client-secret.jwt:ro
      - ./module/continueIfLogin.js:/usr/src/app/module/continueIfLogin.js

  # Logout
  logout:
    <<: *node-service
    build:
      context: ./logout
      dockerfile: Dockerfile
    container_name: logout
    depends_on:
      redis-token:
        condition: service_healthy
    volumes:
      - ./ssl/combine_ssl.pem:/usr/src/app/ssl/combine_ssl.pem:ro
      - ./ssl/logout/logout.crt:/usr/src/app/ssl/logout.crt:ro
      - ./ssl/logout/logout.key:/usr/src/app/ssl/logout.key:ro
    secrets:
      - redis-token      

  # Refresh Token Renewer Service
  refresh-token-renewer:
    <<: *node-service
    build:
      context: ./refresh-token-renewer
      dockerfile: Dockerfile
    container_name: refresh-token-renewer
    depends_on:
      redis-token:
        condition: service_healthy
    volumes:
      - ./ssl/combine_ssl.pem:/usr/src/app/ssl/combine_ssl.pem:ro
      - ./ssl/refresh-token-renewer/refresh-token-renewer.crt:/usr/src/app/ssl/refresh-token-renewer.crt:ro
      - ./ssl/refresh-token-renewer/refresh-token-renewer.key:/usr/src/app/ssl/refresh-token-renewer.key:ro
      - ./key/refresh-token/private.pem:/usr/src/app/refresh-token/private.pem:ro
      - ./key/refresh-token/public.pem:/usr/src/app/refresh-token/public.pem:ro
      - ./key/access-token/private.pem:/usr/src/app/access-token/private.pem:ro
      - ./key/api-key/public.pem:/usr/src/app/api-key/public.pem:ro
      - ./module/verifyApiKey.js:/usr/src/app/module/verifyApiKey.js
    secrets:
      - redis-token

  # HOSxP API Server Service
  hosxp-api:
    <<: *node-service
    build:
      context: ./hosxp-api
      dockerfile: Dockerfile
    container_name: hosxp-api
    volumes:
      - ./ssl/combine_ssl.pem:/usr/src/app/ssl/combine_ssl.pem:ro
      - ./ssl/hosxp-api/hosxp-api.crt:/usr/src/app/ssl/hosxp-api.crt:ro
      - ./ssl/hosxp-api/hosxp-api.key:/usr/src/app/ssl/hosxp-api.key:ro
      - ./key/api-key/public.pem:/usr/src/app/api-key/public.pem:ro
      - ./module/verifyApiKey.js:/usr/src/app/module/verifyApiKey.js
    secrets:
      - hosxp-db-password

  # moph-alert
  moph-alert:
    <<: *node-service
    build:
      context: ./moph-alert
      dockerfile: Dockerfile
    container_name: moph-alert
    volumes:
      - ./ssl/combine_ssl.pem:/usr/src/app/ssl/combine_ssl.pem:ro
      - ./ssl/moph-alert/moph-alert.crt:/usr/src/app/ssl/moph-alert.crt:ro
      - ./ssl/moph-alert/moph-alert.key:/usr/src/app/ssl/moph-alert.key:ro
      - ./key/api-key/public.pem:/usr/src/app/api-key/public.pem:ro
      - ./module/verifyApiKey.js:/usr/src/app/module/verifyApiKey.js 

  # Authorized Server
  authorized-server:
    <<: *node-service
    build:
      context: ./authorized-server
      dockerfile: Dockerfile
    container_name: authorized-server
    depends_on:
      redis-token:
        condition: service_healthy
    volumes:
      - ./ssl/combine_ssl.pem:/usr/src/app/ssl/combine_ssl.pem:ro
      - ./ssl/authorized-server/authorized-server.crt:/usr/src/app/ssl/authorized-server.crt:ro
      - ./ssl/authorized-server/authorized-server.key:/usr/src/app/ssl/authorized-server.key:ro
      - ./key/refresh-token/private.pem:/usr/src/app/refresh-token/private.pem:ro
      - ./key/access-token/private.pem:/usr/src/app/access-token/private.pem:ro
      - ./key/api-key/public.pem:/usr/src/app/api-key/public.pem:ro
      - ./jwt/authorized-server/client-secret.jwt:/usr/src/app/jwt/client-secret.jwt:ro
      - ./module/tokenGenerator.js:/usr/src/app/module/tokenGenerator.js
      - ./module/verifyApiKey.js:/usr/src/app/module/verifyApiKey.js
    secrets:
      - redis-token

# --- New LINE Bot Service ---
  webhook:
    <<: *node-service
    build:
      context: ./webhook
      dockerfile: Dockerfile
    container_name: webhook
    volumes:
      - ./ssl/combine_ssl.pem:/usr/src/app/ssl/combine_ssl.pem:ro
      - ./ssl/webhook/webhook.crt:/usr/src/app/ssl/webhook.crt:ro
      - ./ssl/webhook/webhook.key:/usr/src/app/ssl/webhook.key:ro

# Ingestion Service (Polls HOS DB -> Checks Registration -> Pushes to Redis)
  ingestion:
    <<: *node-service
    build:
      context: ./ingestion
      dockerfile: Dockerfile
    container_name: ingestion
    depends_on:
      redis-subscribe:
        condition: service_healthy
      subscribe-db:
        condition: service_healthy
    volumes:
      - ./ssl/combine_ssl.pem:/usr/src/app/ssl/combine_ssl.pem:ro
    secrets:
      - redis-subscribe
      - subscribe-db-password
      - hosxp-db-password

# Monitor-drug Service
  monitor-drug:
    <<: *node-service
    build:
      context: ./monitor-drug
      dockerfile: Dockerfile
    container_name: monitor-drug
    depends_on:
      redis-subscribe:
        condition: service_healthy
    volumes:
      - ./ssl/combine_ssl.pem:/usr/src/app/ssl/combine_ssl.pem:ro
      - ./jwt/monitor-drug/client-secret.jwt:/usr/src/app/jwt/client-secret.jwt:ro
    secrets:
      - redis-subscribe
      - hosxp-db-password

# Monitor-appointment Service
  monitor-appointment:
    <<: *node-service
    build:
      context: ./monitor-appointment
      dockerfile: Dockerfile
    container_name: monitor-appointment
    depends_on:
      subscribe-db:
        condition: service_healthy
    volumes:
      - ./ssl/combine_ssl.pem:/usr/src/app/ssl/combine_ssl.pem:ro
      - ./jwt/monitor-appointment/client-secret.jwt:/usr/src/app/jwt/client-secret.jwt:ro
    secrets:
      - subscribe-db-password
      - hosxp-db-password

# DATABASES 

  # Redis
  redis-token:
    image: redis:alpine # Note: Updated from 8.8.0-alpine (which doesn't exist standardly yet) to alpine
    container_name: redis-token
    command: >
      sh -c "redis-server /usr/local/etc/redis/redis.conf --requirepass \$$(cat /run/secrets/redis-token)"
    healthcheck:
          test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis-token)\" ping | grep PONG || exit 1"]
          interval: 10s
          timeout: 5s
          retries: 5
          start_period: 5s
    volumes:
      - ./redis-token/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-token:/data
    secrets:
      - redis-token
    restart: unless-stopped
    networks:
      - app-network  

  # Redis
  redis-subscribe:
    image: redis:alpine # Note: Updated from 8.8.0-alpine (which doesn't exist standardly yet) to alpine
    container_name: redis-subscribe
    command: >
      sh -c "redis-server /usr/local/etc/redis/redis.conf --requirepass \$$(cat /run/secrets/redis-subscribe)"
    healthcheck:
          test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis-subscribe)\" ping | grep PONG || exit 1"]
          interval: 10s
          timeout: 5s
          retries: 5
          start_period: 5s      
    volumes:
      - ./redis-subscribe/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-subscribe:/data
    secrets:
      - redis-subscribe
    restart: unless-stopped
    networks:
      - app-network

  # MySQL
  subscribe-db:
    image: mysql:9
    container_name: subscribe-db
    restart: always
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u nakorn --password="$$(cat /run/secrets/subscribe-db-password)" --silent']
      interval: 3s
      retries: 5
      start_period: 30s
    secrets:
      - subscribe-db-password
    environment:
      - MYSQL_DATABASE=subscribe_db
      - MYSQL_USER=nakorn
      - MYSQL_PASSWORD_FILE=/run/secrets/subscribe-db-password
      - TZ=Asia/Bangkok
    volumes:
      - ./subscribe-db/my.cnf:/etc/mysql/my.cnf
      - ./subscribe-db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql-subscribe:/var/lib/mysql
    networks:
      - app-network

# Volume
volumes:
  redis-token:
    driver: local
  redis-subscribe:
    driver: local    
  mysql-subscribe:
    name: mysql-subscribe

# Network
networks:
  app-network:
    name: app-network
    driver: bridge

# Secrets
secrets:
  redis-token:
    file: ./secrets/redis-token.password
  redis-subscribe:
    file: ./secrets/redis-subscribe.password
  subscribe-db-password:
    file: ./secrets/subscribe-db.password
  hosxp-db-password:
    file: ./secrets/hosxp-db.password
