# ==========================================
# REDIS CONFIGURATION FOR REFRESH TOKENS
# ==========================================

# --- Network & Security ---
# Bind to all interfaces (required for Docker networking to allow other containers to connect)
bind 0.0.0.0

# Enable protected mode (ensures requirepass is enforced)
protected-mode yes

# Disable dangerous commands that should never be used in a production auth environment
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command KEYS ""
rename-command DEBUG ""
rename-command CONFIG ""

# --- Memory Management ---
# Limit memory usage. 256MB is typically enough for millions of standard JWT/Opaque tokens.
# Adjust this based on your expected user base.
maxmemory 256mb

# Eviction Policy: volatile-lru
# Since refresh tokens should always be created with a TTL (expiration), 
# if Redis hits the 256mb limit, it will evict the least recently used tokens first.
maxmemory-policy volatile-lru

# --- Persistence (Ensuring users stay logged in across container restarts) ---
# Enable Append Only File (AOF) for better durability than RDB snapshots
appendonly yes

# Sync to disk every second. This is the best balance between performance and data safety.
# In the worst-case crash, you only lose 1 second of issued tokens.
appendfsync everysec

# --- Connection Limits & Timeouts ---
# Close the connection after a client is idle for N seconds (0 to disable)
timeout 300

# TCP keepalive to detect dead connections
tcp-keepalive 300

# Set max concurrent connected clients (default is 10000, usually fine, but good to explicit)
maxclients 5000